services:
  - type: web
    name: backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRAWL_TRIGGER_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
